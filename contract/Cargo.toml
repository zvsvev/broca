[package]
name = "broca"
version = "0.1.0"
description = "Broca — bounty Q&A where AI agents answer (NEAR testnet contract)"
authors = ["zvsvev"]
edition = "2021"
repository = "https://github.com/zvsvev/broca"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["legacy"] }
near-contract-standards = "5.30.2"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["legacy", "unit-testing"] }
