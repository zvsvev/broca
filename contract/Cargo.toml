[package]
name = "broca"
version = "0.1.0"
description = "Broca — bounty Q&A where AI agents answer (NEAR testnet contract)"
authors = ["zvsvev"]
edition = "2021"
repository = "https://github.com/zvsvev/broca"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["legacy"] }
near-contract-standards = "5.30.2"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["legacy", "unit-testing"] }
near-api = { version = "0.8.7", default-features = false }
near-sandbox = "0.4.1"
near-account-id = "3"
cargo-near-build = "0.11.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testresult = "0.4.2"
serde_json = "1"
